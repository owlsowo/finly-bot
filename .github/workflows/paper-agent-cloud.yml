name: Run Finly on the official Alpaca paper account

on:
  workflow_dispatch:
    inputs:
      initialize_state:
        description: Initialize encrypted cloud state before the competition starts
        required: true
        default: false
        type: boolean
  schedule:
    # The date-specific schedule covers U.S. market hours in the official 2026
    # scoring window. The in-process UTC gate remains authoritative.
    - cron: "30 12 31 8 *"
    - cron: "*/5 13-19 31 8 *"
    - cron: "0 20 31 8 *"
    - cron: "*/5 13-19 1-3 9 *"
    - cron: "0 20 1-3 9 *"
    - cron: "30 13 4 9 *"

permissions:
  contents: read

concurrency:
  group: finly-official-paper-agent
  cancel-in-progress: false

env:
  FINLY_COMPETITION_START_AT: "2026-08-31T13:30:00.000Z"
  FINLY_COMPETITION_END_AT: "2026-09-04T13:30:00.000Z"
  FINLY_OPTIONS_ENTRY_CUTOFF_AT: "2026-09-02T19:00:00.000Z"
  FINLY_OPTIONS_FORCE_FLAT_AT: "2026-09-03T19:00:00.000Z"
  FINLY_CLOUD_STATE_BRANCH: finly-cloud-state

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
      mode: ${{ steps.window.outputs.mode }}
      mutation_enabled: ${{ steps.window.outputs.mutation_enabled }}
      window_status: ${{ steps.window.outputs.window_status }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: Enforce the exact scoring window
        id: window
        env:
          INITIALIZE_REQUESTED: ${{ inputs.initialize_state }}
        run: node scripts/cloud_run_gate.mjs

  paper-cycle:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TOOLSETS: account,trading,assets,stock-data,options-data,news,corporate-actions
      APCA_API_KEY_ID: ${{ secrets.FINLY_ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.FINLY_ALPACA_SECRET_KEY }}
      ALPACA_API_KEY: ${{ secrets.FINLY_ALPACA_API_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.FINLY_ALPACA_SECRET_KEY }}
      FINLY_COMPETITION_ACCOUNT_ID: ${{ secrets.FINLY_COMPETITION_ACCOUNT_ID }}
      FINLY_PAPER_SIGNING_SECRET: ${{ secrets.FINLY_PAPER_SIGNING_SECRET }}
      FINLY_CLOUD_STATE_SECRET: ${{ secrets.FINLY_CLOUD_STATE_SECRET }}
      FINLY_PAPER_MUTATION_ACK: ${{ secrets.FINLY_PAPER_MUTATION_ACK }}
      FINLY_EXECUTION_TRANSPORT: mcp
      FINLY_EXECUTION_ENABLED: ${{ needs.gate.outputs.mutation_enabled }}
      FINLY_G4_PRODUCTION_ENABLED: "true"
      FINLY_G4_CHECKPOINT_PATH: data/private/g4-official-equity
      FINLY_G4_LOG_PATH: outputs/g4_official_equity.jsonl
      FINLY_AGENT_INTERVAL_SECONDS: "0"
      FINLY_HORIZON_SESSIONS: "3"
      FINLY_USE_LOCAL_LLAMA_EVENTS: "false"
      FINLY_USE_FEATHERLESS_EVENTS: "true"
      FINLY_FEATHERLESS_MODEL: Qwen/Qwen3-32B
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      FINLY_ALLOW_DETERMINISTIC_FALLBACK: "false"
      FINLY_CODE_VERSION: ${{ github.sha }}
      FINLY_DECISION_LOG: outputs/autonomous_decisions.jsonl
      FINLY_AGENT_LOCK_PATH: data/private/autonomous-paper-agent.lock
      FINLY_PERMIT_LEDGER_PATH: data/ledger
      FINLY_LIFECYCLE_CHECKPOINT_PATH: data/private/paper-lifecycle
      FINLY_PAPER_SESSION_PATH: data/private/paper-sessions
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - uses: actions/setup-python@v6
        if: needs.gate.outputs.mode != 'final'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/cloud-requirements.txt

      - name: Verify required secrets without exposing them
        env:
          RUN_MODE: ${{ needs.gate.outputs.mode }}
        run: |
          node - <<'NODE'
          const required = [
            "APCA_API_KEY_ID",
            "APCA_API_SECRET_KEY",
            "FINLY_COMPETITION_ACCOUNT_ID",
            "FINLY_PAPER_SIGNING_SECRET",
            "FINLY_CLOUD_STATE_SECRET",
            "FEATHERLESS_API_KEY",
          ];
          if (process.env.RUN_MODE === "live") required.push("FINLY_PAPER_MUTATION_ACK");
          if (required.some((name) => !process.env[name] || Buffer.byteLength(process.env[name]) < 12)) {
            throw new Error("one or more required Finly cloud secrets are unavailable");
          }
          if (Buffer.byteLength(process.env.FINLY_PAPER_SIGNING_SECRET) < 32
            || Buffer.byteLength(process.env.FINLY_CLOUD_STATE_SECRET) < 32) {
            throw new Error("Finly cloud signing and state secrets must contain at least 32 bytes");
          }
          if (!/^\S{12,}$/.test(process.env.FEATHERLESS_API_KEY)) {
            throw new Error("the Featherless key is unavailable or malformed");
          }
          NODE

      - name: Install the pinned official Alpaca MCP server
        if: needs.gate.outputs.mode != 'final'
        run: |
          python -m venv .venv-alpaca-mcp
          .venv-alpaca-mcp/bin/python -m pip install --disable-pip-version-check -r config/cloud-requirements.txt

      - name: Verify both pinned mutation schemas without a broker call
        if: needs.gate.outputs.mode != 'final'
        env:
          APCA_API_KEY_ID: ""
          APCA_API_SECRET_KEY: ""
          ALPACA_API_KEY: ""
          ALPACA_SECRET_KEY: ""
          FINLY_COMPETITION_ACCOUNT_ID: ""
          FINLY_PAPER_MUTATION_ACK: ""
        run: .venv-alpaca-mcp/bin/python scripts/introspect_alpaca_mcp.py

      - name: Probe the hosted evidence path before the opening bell
        if: needs.gate.outputs.mode == 'initialize' || needs.gate.outputs.mode == 'readiness'
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ""
          APCA_API_SECRET_KEY: ""
          ALPACA_API_KEY: ""
          ALPACA_SECRET_KEY: ""
          FINLY_COMPETITION_ACCOUNT_ID: ""
          FINLY_PAPER_SIGNING_SECRET: ""
          FINLY_CLOUD_STATE_SECRET: ""
          FINLY_PAPER_MUTATION_ACK: ""
        run: node scripts/featherless_readiness_check.mjs

      - name: Prepare the isolated state publication branch
        id: state
        env:
          RUN_MODE: ${{ needs.gate.outputs.mode }}
        run: |
          publication="$RUNNER_TEMP/finly-cloud-state"
          if git fetch --no-tags origin "$FINLY_CLOUD_STATE_BRANCH:refs/remotes/origin/$FINLY_CLOUD_STATE_BRANCH"; then
            git worktree add --detach "$publication" "origin/$FINLY_CLOUD_STATE_BRANCH"
            git -C "$publication" switch -C "$FINLY_CLOUD_STATE_BRANCH" "origin/$FINLY_CLOUD_STATE_BRANCH"
            state_exists=true
          else
            if [ "$RUN_MODE" != "initialize" ]; then
              echo "Encrypted Finly cloud state is missing; initialize it manually before running the agent." >&2
              exit 1
            fi
            git worktree add --detach "$publication" HEAD
            git -C "$publication" switch --orphan "$FINLY_CLOUD_STATE_BRANCH"
            state_exists=false
          fi
          git -C "$publication" config user.name "finly-cloud-runner"
          git -C "$publication" config user.email "finly-cloud-runner@users.noreply.github.com"
          echo "publication_dir=$publication" >> "$GITHUB_OUTPUT"
          echo "state_exists=$state_exists" >> "$GITHUB_OUTPUT"

      - name: Restore authenticated private state
        if: steps.state.outputs.state_exists == 'true'
        env:
          FINLY_CLOUD_STATE_PUBLICATION_DIR: ${{ steps.state.outputs.publication_dir }}
        run: node scripts/cloud_state.mjs restore --input "$FINLY_CLOUD_STATE_PUBLICATION_DIR/private-state.enc.json"

      - name: Run one guarded autonomous paper cycle
        if: needs.gate.outputs.mode == 'live'
        env:
          FINLY_CLOUD_STATE_PUBLICATION_DIR: ${{ steps.state.outputs.publication_dir }}
          FINLY_MCP_PYTHON: ${{ github.workspace }}/.venv-alpaca-mcp/bin/python
          FINLY_MCP_SERVER_COMMAND: ${{ github.workspace }}/.venv-alpaca-mcp/bin/alpaca-mcp-server
        run: node scripts/autonomous_paper_agent.mjs

      - name: Build a sanitized read-only dashboard snapshot
        env:
          FINLY_CLOUD_STATE_PUBLICATION_DIR: ${{ steps.state.outputs.publication_dir }}
        run: node scripts/build_competition_live_snapshot.mjs --output "$RUNNER_TEMP/competition_live.json"

      - name: Persist encrypted state and publish only sanitized metrics
        env:
          FINLY_CLOUD_STATE_PUBLICATION_DIR: ${{ steps.state.outputs.publication_dir }}
        run: node scripts/cloud_state.mjs publish --publication-dir "$FINLY_CLOUD_STATE_PUBLICATION_DIR" --snapshot "$RUNNER_TEMP/competition_live.json"
