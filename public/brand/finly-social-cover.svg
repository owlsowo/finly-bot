<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Finly - from market evidence to a bounded options decision</title>
  <desc id="desc">A checked defined-risk options decision with deterministic maximum-loss and stress-test controls.</desc>
  <rect width="1200" height="630" fill="#f6f3ec"/>
  <rect x="0" y="0" width="28" height="630" fill="#0d2b43"/>

  <g transform="translate(70 46)">
    <path d="M8 9c8 2 14 8 18 18-8-3-13-8-15-15-2 5-2 10 0 16-5-5-6-12-3-19Z" fill="#e8efea" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M56 9c-8 2-14 8-18 18 8-3 13-8 15-15 2 5 2 10 0 16 5-5 6-12 3-19Z" fill="#e8efea" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M20 25c3-5 7-7 12-7s9 2 12 7l-2 20c-3 7-6 10-10 12-4-2-7-5-10-12l-2-20Z" fill="#2e6f5c" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M27 27h12v4h-7v6h6v4h-6v10h-5V27Z" fill="#f6f3ec"/>
    <text x="86" y="43" fill="#0d2b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">FINLY</text>
  </g>

  <text x="1130" y="68" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" text-anchor="end">ALPACA AI TRADING AGENTS HACKATHON</text>
  <line x1="70" y1="124" x2="1130" y2="124" stroke="#0d2b43" stroke-width="1.5"/>

  <text x="70" y="175" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">AGENTIC RESEARCH · DETERMINISTIC RISK CONTROL</text>
  <g fill="#0d2b43" font-family="Georgia, Times New Roman, serif" font-size="50" font-weight="700" letter-spacing="-1.3">
    <text x="70" y="252">From market evidence to a</text>
    <text x="70" y="318">bounded options decision.</text>
  </g>

  <line x1="70" y1="367" x2="1130" y2="367" stroke="#c8ccc7" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="410" fill="#68706f" font-size="12" font-weight="700" letter-spacing="1.2">EXACT MAXIMUM LOSS</text>
    <text x="70" y="468" fill="#2e6f5c" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700">$366</text>

    <text x="486" y="410" fill="#68706f" font-size="12" font-weight="700" letter-spacing="1.2">MAXIMUM GAIN</text>
    <text x="486" y="468" fill="#0d2b43" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700">$634</text>

    <g transform="translate(936 402) rotate(-1)">
      <rect width="194" height="68" fill="#e7f0eb" stroke="#2e6f5c" stroke-width="2"/>
      <text x="97" y="42" fill="#2e6f5c" font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="middle">BOUNDED</text>
    </g>
  </g>

  <line x1="70" y1="516" x2="1130" y2="516" stroke="#0d2b43" stroke-width="1.5"/>
  <text x="70" y="558" fill="#263238" font-family="Georgia, Times New Roman, serif" font-size="21">4/4 source-removal checks · 32/32 perturbation checks</text>
  <text x="70" y="578" fill="#68706f" font-family="Arial, Helvetica, sans-serif" font-size="12">One-contract defined-risk spread · synthetic paper replay</text>
  <text x="70" y="603" fill="#68706f" font-family="Arial, Helvetica, sans-serif" font-size="12">Alpaca-compatible payload compiled locally · no order transmitted</text>
  <text x="1130" y="603" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="end">BRUCE WEN · SOLO BUILDER</text>
</svg>
