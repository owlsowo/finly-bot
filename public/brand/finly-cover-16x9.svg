<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Finly — from market evidence to a bounded options decision</title>
  <desc id="desc">Hackathon cover showing a checked defined-risk options decision with deterministic maximum-loss and stress-test controls.</desc>
  <rect width="1920" height="1080" fill="#f6f3ec"/>
  <rect x="0" y="0" width="44" height="1080" fill="#0d2b43"/>

  <g transform="translate(112 76) scale(1.45)">
    <path d="M8 9c8 2 14 8 18 18-8-3-13-8-15-15-2 5-2 10 0 16-5-5-6-12-3-19Z" fill="#e8efea" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M56 9c-8 2-14 8-18 18 8-3 13-8 15-15 2 5 2 10 0 16 5-5 6-12 3-19Z" fill="#e8efea" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M20 25c3-5 7-7 12-7s9 2 12 7l-2 20c-3 7-6 10-10 12-4-2-7-5-10-12l-2-20Z" fill="#2e6f5c" stroke="#0d2b43" stroke-width="2" stroke-linejoin="round"/>
    <path d="M27 27h12v4h-7v6h6v4h-6v10h-5V27Z" fill="#f6f3ec"/>
    <text x="86" y="43" fill="#0d2b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">FINLY</text>
  </g>

  <text x="1808" y="118" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2.5" text-anchor="end">ALPACA AI TRADING AGENTS HACKATHON</text>
  <line x1="112" y1="202" x2="1808" y2="202" stroke="#0d2b43" stroke-width="2"/>

  <text x="112" y="292" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3">AGENTIC RESEARCH · DETERMINISTIC RISK CONTROL</text>
  <g fill="#0d2b43" font-family="Georgia, Times New Roman, serif" font-size="88" font-weight="700" letter-spacing="-2">
    <text x="112" y="430">From market evidence to a</text>
    <text x="112" y="546">bounded options decision.</text>
  </g>

  <line x1="112" y1="624" x2="1808" y2="624" stroke="#c8ccc7" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="692" fill="#68706f" font-size="19" font-weight="700" letter-spacing="2">EXACT MAXIMUM LOSS</text>
    <text x="112" y="800" fill="#2e6f5c" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="700">$366</text>

    <text x="780" y="692" fill="#68706f" font-size="19" font-weight="700" letter-spacing="2">MAXIMUM GAIN</text>
    <text x="780" y="800" fill="#0d2b43" font-family="Georgia, Times New Roman, serif" font-size="92" font-weight="700">$634</text>

    <g transform="translate(1515 690) rotate(-1)">
      <rect width="293" height="112" fill="#e7f0eb" stroke="#2e6f5c" stroke-width="3"/>
      <text x="146.5" y="68" fill="#2e6f5c" font-size="28" font-weight="700" letter-spacing="2.5" text-anchor="middle">BOUNDED</text>
    </g>
  </g>

  <line x1="112" y1="884" x2="1808" y2="884" stroke="#0d2b43" stroke-width="2"/>
  <text x="112" y="958" fill="#263238" font-family="Georgia, Times New Roman, serif" font-size="35">4/4 source-removal checks · 32/32 perturbation checks</text>
  <text x="112" y="1000" fill="#68706f" font-family="Arial, Helvetica, sans-serif" font-size="19">One-contract defined-risk spread · synthetic paper replay</text>
  <text x="112" y="1038" fill="#68706f" font-family="Arial, Helvetica, sans-serif" font-size="18">Alpaca-compatible payload compiled locally · no order transmitted</text>
  <text x="1808" y="1038" fill="#2e6f5c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">BRUCE WEN · SOLO BUILDER</text>
</svg>
