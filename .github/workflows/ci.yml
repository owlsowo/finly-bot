name: Verify Finly

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install artifact inspectors
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils
      - run: npm ci
      - run: npm run verify
      - name: Generated receipts are committed and reproducible
        run: git diff --exit-code -- public/data src/data
